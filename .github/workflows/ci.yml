# CI for snowball-mcp's own code (gap register E26). The repository is public, so standard runners
# are free. Every job is read-only and holds no secret; pull requests from forks run under the same limits.
#
#   every push and pull request: the referee's unit tests on Linux and Windows, the drill judge's tests
#   main and daily, in addition: the mutation checks (referee in shards of four mutants at a time, as many shards as
#   its mutants need and at least 24; reference brain, drill judge), the end-to-end run against Docker, and the claude
#   CLI contract against the pinned binary (a made-up token: it spends nothing)
#
# A run on main is never cancelled or replaced: its concurrency group is its own run (delivery step 1 reads the last
# push run on main, `seed/founder/deliver_epoch.py`). On any other branch and on pull requests a new push cancels the
# stale run. The documentation floor is not here: doc-with-change.yml runs it on every push to main with no
# concurrency group at all (E383).

name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"  # daily: the mutation run without hints (`local/mutate.py --hints`)
  workflow_dispatch:
    inputs:
      mutant_hints:
        description: "on: re-run each mutant's earlier killer first (verified against this tree); off: whole suite"
        type: choice
        options: ["on", "off"]
        default: "on"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && format('main-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  unit-linux:
    runs-on: ubuntu-24.04  # its system python3 is the 3.12 the referee's own workflow runs on
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Referee unit tests
        working-directory: seed/bootstrap
        run: PYTHONPATH=.:tests python3 -m unittest discover -s tests
      - name: Drill judge tests
        working-directory: seed/drill
        run: python3 -m unittest discover -s tests

  unit-windows:
    runs-on: windows-2025  # the operator imports at stage exits on Windows
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # the suite outgrew one 20-minute job on Windows (E501, test_wiring UnitShardTest): its classes in 4 shards
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Referee unit tests
        working-directory: seed/bootstrap
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: PYTHONPATH=".;tests" python local/unit_shard.py "$SHARD/4"
      - name: Drill judge tests
        if: matrix.shard == 0
        working-directory: seed/drill
        shell: bash
        run: python -m unittest discover -s tests

  # A push to main that changes only pages (spec/, docs/, *.md) runs the mutants anchored in those pages in one job
  # (`mutate.mutants_for_changed`); any other change, the weekly run and a manual run run every mutant in shards.
  # The plan also sizes the shards from the mutants of this commit (`mutate.shard_count`, E737): none holds more than
  # its four workers finish at the worst mutant seen in three quarters of the timeout, and there are at least 24.
  mutation-plan:
    if: github.event_name != 'pull_request' && (github.event_name != 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: plan
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          mode=full
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE" HEAD > changed.txt
            if [ -s changed.txt ] && ! grep -qvE '^(spec/|docs/)|\.md$' changed.txt; then mode=pages; fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "mutation mode: $mode"
          # no pipe: under the default bash -e a failed plan ends the step red; the check reads the file back
          python3 seed/bootstrap/local/mutate.py --shard-plan > "$RUNNER_TEMP/plan.txt"
          python3 seed/bootstrap/local/mutate.py --check-plan "$RUNNER_TEMP/plan.txt"
          tee -a "$GITHUB_OUTPUT" < "$RUNNER_TEMP/plan.txt"

  mutation-pages:
    needs: mutation-plan
    if: needs.mutation-plan.outputs.mode == 'pages'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Mutants anchored in the changed pages (every one must be killed)
        working-directory: seed/bootstrap
        env:
          BEFORE: ${{ github.event.before }}
        run: git diff --name-only "$BEFORE" HEAD > /tmp/changed.txt && python3 local/mutate.py --changed /tmp/changed.txt --jobs 4

  mutation:
    needs: mutation-plan
    if: needs.mutation-plan.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # the account runs at most 20 jobs at once; 16 shards leave the referee's jobs room to start (E525)
      max-parallel: 16
      matrix:
        # the plan's shards (`mutate.shard_count`): four mutants at a time on the runner's four cores, at most 22 a
        # worker even with no hint; at the worst seen, 6 minutes a mutant four at a time, a shard ends in 132 of its
        # 180 (E410, E502, E737; `test_wiring.MutationShardTest`)
        shard: ${{ fromJSON(needs.mutation-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Hints are the killers of an earlier run (`mutation-complete` saves them). Each is re-run against this tree and
      # counts only when its test fails with the mutant and passes alone without it; a miss runs the whole suite. The
      # daily run and a dispatch with mutant_hints=off use none.
      - name: Earlier killers as hints
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mutant-hints.json
          key: mutant-hints-${{ github.run_id }}
          restore-keys: mutant-hints-
      - name: Referee mutants (every one must be killed)
        working-directory: seed/bootstrap
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.mutation-plan.outputs.count }}
          EVENT: ${{ github.event_name }}
          HINTS_INPUT: ${{ inputs.mutant_hints }}
        run: |
          hints=()
          if [ "$EVENT" != schedule ] && [ "$HINTS_INPUT" != off ]; then hints=(--hints "$GITHUB_WORKSPACE/mutant-hints.json"); fi
          python3 local/mutate.py --shard "$SHARD/$SHARDS" --jobs 4 "${hints[@]}" --record "$RUNNER_TEMP/records/shard-$SHARD.jsonl"
      - name: This shard's records
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-records-${{ matrix.shard }}
          path: ${{ runner.temp }}/records/shard-${{ matrix.shard }}.jsonl
          if-no-files-found: error
          retention-days: 7

  # The union of the shards is every mutant, each once and killed; a shard that ran nothing, or a partition that
  # lost or repeated a mutant, turns the run red here. Its killers become the next run's hints.
  mutation-complete:
    needs: [mutation-plan, mutation]
    if: ${{ !cancelled() && needs.mutation-plan.outputs.mode == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-records-*
          path: ${{ runner.temp }}/records
      - name: Every mutant once, every one killed
        working-directory: seed/bootstrap
        run: python3 local/mutate.py --check-records "$RUNNER_TEMP/records" --hints-out "$GITHUB_WORKSPACE/mutant-hints.json"
      - name: The killers as the next run's hints
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mutant-hints.json
          key: mutant-hints-${{ github.run_id }}-${{ github.run_attempt }}

  fixture-mutation:
    if: github.event_name != 'pull_request' && (github.event_name != 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reference brain mutants
        working-directory: seed/bootstrap
        run: python3 local/mutate_brain.py
      - name: Drill judge mutants
        working-directory: seed/drill
        run: python3 local/mutate_drill.py

  e2e:
    if: github.event_name != 'pull_request' && (github.event_name != 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04  # Docker is on the runner; the image is pinned by digest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The referee end to end against real containers (rival stubbed)
        working-directory: seed/bootstrap
        run: python3 local/e2e.py

  cli-contract:
    if: github.event_name != 'pull_request' && (github.event_name != 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The pinned claude CLI, as the referee installs it
        run: npm ci --prefix seed/bootstrap/requirements/claude-cli --no-audit --no-fund
      - name: CLI contract (made-up token, no spend)
        working-directory: seed/bootstrap
        run: |
          export PATH="$PWD/requirements/claude-cli/node_modules/.bin:$PATH"
          claude --version
          PYTHONPATH=.:tests python3 -m unittest discover -s tests -p test_live_cli.py -v
